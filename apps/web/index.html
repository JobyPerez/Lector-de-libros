<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="application-name" content="El conejo lector" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Conejo lector" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#264f3d" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="icon" href="%BASE_URL%favicon.png" sizes="64x64" type="image/png" />
    <link rel="shortcut icon" href="%BASE_URL%favicon.png" type="image/png" />
    <title>Lector de libros</title>
    <script>
      (function() {
        try {
          var mode = localStorage.getItem('lector.themeMode') || 'system';
          var palette = localStorage.getItem('lector.themePalette') || 'default';
          var isDark = mode === 'dark' || (mode === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var effectiveMode = isDark ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme-mode', effectiveMode);
          document.documentElement.setAttribute('data-theme-preference', mode);
          document.documentElement.setAttribute('data-theme-palette', palette);
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
